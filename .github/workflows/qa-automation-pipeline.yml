name: QA Automation Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        run: npm test
        continue-on-error: true

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: reports
          if-no-files-found: warn

      - name: Fail job when tests fail
        if: steps.playwright.outcome == 'failure'
        run: exit 1

  ai-agent:
    runs-on: ubuntu-latest
    needs: test
    if: always()

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Playwright results
        uses: actions/download-artifact@v4
        with:
          name: playwright-results
          path: ci-artifacts

      - name: Update README test status
        run: python ai/update_readme_test_status.py --report ci-artifacts/report.json --readme README.md

      - name: Generate LLM test summary
        run: |
          export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
          python ai/generate_llm_test_summary.py --report ci-artifacts/report.json --readme README.md --markdown-out reports/llm-summary.md --json-out reports/llm-summary.json

      - name: Upload LLM summary artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: llm-summary
          path: |
            reports/llm-summary.md
            reports/llm-summary.json
          if-no-files-found: warn

      - name: Upload README preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: readme-preview
          path: README.md

      - name: Build Pages site
        run: python ai/build_pages_report.py --report ci-artifacts/report.json --llm-summary reports/llm-summary.json --html-report-dir ci-artifacts/html --output-dir site

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Commit updated docs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "sperezfru@gmail.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No README changes to commit."
            exit 0
          fi
          git commit -m "docs: update test status [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

  deploy-pages:
    runs-on: ubuntu-latest
    needs: ai-agent
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Log Pages URL
        run: |
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          fallback_url="https://${owner}.github.io/${repo}/"
          echo "GitHub Pages URL (deploy output): ${{ steps.deployment.outputs.page_url }}"
          echo "GitHub Pages URL (fallback): ${fallback_url}"